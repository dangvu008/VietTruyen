  durable_writer: scripts/memory-ledger.py
  database: memory/story.db
  durable_ledgers:
    - memory/events.jsonl
    - memory/knowledge.jsonl
    - memory/edges.jsonl
    - memory/threads.jsonl
  policy: config/story-os/long-horizon-memory.yaml
  status: bootstrap_required
  raw_accepted_prose_is_authority: true
  sqlite_is_derived_cache: true
  per_story_namespace: true
  retrieval_modes:
    - lexical_fts5
    - temporal_state
    - graph_neighbors
    - knowledge_layers
    - open_threads
  vector_rag: optional_non_authoritative
  real_dream_separation: required

milestone_audits:
  baseline_drift_every: 25
  major_1_1000_every: 100
  major_1001_1500_every: 75
  major_1501_3000_every: 50
  major_above_3000_every: 25
  deep_integrity_from: 1000
  deep_integrity_every: 500

required_ledgers:
- event_log
- current_state
- knowledge
- open_threads
- real_timeline
- dream_timeline
- cross_world_relations
- arc_fingerprint
- reward_history
- graph
- memory_health
- checkpoint_chain

authority_order:
- canon_static
- canon_dynamic
- published_evidence
- planning
- derived_runtime
